# Promptly CI: JS checks plus native compile checks (no signing, no store upload, no secrets).
# Native jobs prove that the app and the local module `modules/promptly-media` compile; they do not
# run anything on a device.
name: promptly-ci

on:
  push:
    branches: [claude/youthful-volta-vdsr0x]
    # Docs-only changes do not need native builds.
    paths: ['promptly/**', '!promptly/**/*.md', '!promptly/docs/**', '.github/workflows/promptly-ci.yml', '.github/scripts/**']
  workflow_dispatch:

concurrency:
  group: promptly-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: promptly

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            promptly/package-lock.json
            promptly/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Server
        working-directory: promptly/server
        run: npm ci && npm run typecheck && npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same feature flags as the EAS preview profile (eas.json).
      EXPO_PUBLIC_FLAG_BURN_IN: 'on'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promptly/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      # Pre-install the NDK the React Native template pins, with retries: Gradle's on-demand
      # download fails now and then on hosted runners.
      - name: Install NDK
        working-directory: promptly/android
        run: |
          NDK=$(grep -h -o -E 'ndkVersion *= *"[0-9.]+"' build.gradle app/build.gradle ../node_modules/react-native/gradle/libs.versions.toml 2>/dev/null | head -n1 | grep -o -E '[0-9][0-9.]+')
          NDK=${NDK:-27.1.12297006}
          echo "NDK $NDK"
          for i in 1 2 3; do yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" >/dev/null && break; sleep 20; done
      # Release variant: JS bundle embedded, signed with the template's debug keystore, so it can be
      # sideloaded for internal testing without a dev server. Not a store build.
      - name: Assemble standalone test APK
        working-directory: promptly/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 > gradle.log 2>&1 \
            || { grep -n -E '^e: |^w: .*promptly|error:|What went wrong' -A3 gradle.log | head -200; tail -n 60 gradle.log; exit 1; }
          tail -n 20 gradle.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: promptly-android-test-apk
          path: promptly/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  # Runs the test APK on an Android emulator with the Maestro flows in .maestro/.
  # Emulator ≠ phone: the camera is a virtual scene and on-device speech may be missing, so camera
  # flows are reported but do not fail the job.
  android-e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: promptly-android-test-apk
          path: apk
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        working-directory: .
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          working-directory: promptly
          script: |
            adb install -r ../apk/*.apk
            mkdir -p e2e && adb logcat -c
            adb shell settings put global hide_error_dialogs 1 ; sleep 30 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1 ; adb shell input keyevent KEYCODE_HOME
            adb shell monkey -p app.promptly.placeholder -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 ; sleep 25 ; echo "--- smoke: process" ; adb shell pidof app.promptly.placeholder || echo "NOT RUNNING"
            echo "--- smoke: on-screen text" ; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 ; adb shell cat /sdcard/ui.xml | grep -o -E '(text|resource-id)="[^"]+"' | head -60 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1 ; sleep 3 ; echo "--- smoke: after dismissing system dialogs" ; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 ; adb shell cat /sdcard/ui.xml | grep -o -E '(text|resource-id)="[^"]+"' | head -40
            echo "--- cold start (am start -W, emulator: relative numbers only)" ; for i in 1 2 3; do adb shell am force-stop app.promptly.placeholder ; sleep 2 ; adb shell am start -W -n app.promptly.placeholder/.MainActivity | grep -E 'TotalTime|WaitTime' ; sleep 5 ; done
            echo "--- smoke: crashes / JS errors" ; adb logcat -d -v brief | grep -E 'FATAL|AndroidRuntime|ReactNativeJS|ReactNative|SoLoader|Expo|promptly|Unable|Exception' | grep -v -E 'GoogleApiManager|Finsky' | tail -n 150
            (adb logcat -v time > e2e/logcat.txt &) ; maestro test .maestro/ --exclude-tags camera,hebrew,tour --format junit --output e2e/report.xml --test-output-dir e2e/out ; echo $? > e2e/core-exit ; for f in 03-record-timed 04-captions 05-export; do maestro test .maestro/$f.yaml --test-output-dir e2e/out-camera || { echo "camera flow $f failed (non-gating)"; mkdir -p e2e/camera; adb exec-out screencap -p > e2e/camera/screenshot-$f-failure.png; echo "--- crash lines (logcat)"; grep -E "FATAL EXCEPTION|AndroidRuntime|Fatal signal|ANR in|am_crash|Process app.promptly.placeholder .* has died" e2e/logcat.txt | tail -n 40 || true; }; done ; adb exec-out screencap -p > e2e/last.png ; sh ../.github/scripts/hebrew-android.sh ; sh ../.github/scripts/dark-android.sh ; sh ../.github/scripts/print-failure-shots.sh e2e ; exit $(cat e2e/core-exit)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptly-android-e2e
          path: |
            promptly/e2e
            promptly/screenshots
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Expo SDK 58 Swift packages need Swift tools 6.2 (Xcode 26+): pick the newest installed Xcode.
      - name: Select Xcode
        working-directory: .
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promptly/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install --clean
      - name: Pod install
        working-directory: promptly/ios
        run: pod install
      - name: Resolve Swift packages
        working-directory: promptly/ios
        run: xcodebuild -resolvePackageDependencies -workspace Promptly.xcworkspace -scheme Promptly 2>&1 | tail -n 60
      # Release config: JS bundle embedded, so the simulator run below needs no dev server.
      - name: Build for simulator (unsigned)
        working-directory: promptly/ios
        run: |
          xcodebuild -workspace Promptly.xcworkspace -scheme Promptly -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -n -E 'error:|fatal|Could not resolve' -A12 build.log | head -250;
                 grep -n 'Build ExpoModulesJSI' -A40 build.log | grep -v '^[0-9]*-    export' | head -120;
                 tail -n 40 build.log; exit 1; }
          tail -n 20 build.log
      # Simulator ≠ iPhone: no camera and simulated audio, so camera flows are skipped here.
      - name: Run flows on iOS Simulator
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/Promptly.app
          mkdir -p e2e-ios
          xcrun simctl launch "$UDID" app.promptly.placeholder ; sleep 20
          echo "--- smoke: app process" ; xcrun simctl spawn "$UDID" launchctl list | grep -i promptly || echo "NOT RUNNING"
          xcrun simctl io "$UDID" screenshot e2e-ios/launch.png
          # Actions runs bash with -e: capture the core result without ending the step, so the tours
          # and the failure screenshots still run; the step fails at the end with this code.
          # The XCTest driver sometimes needs more than Maestro's default to come up on a cold simulator.
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          CODE=0 ; maestro --device "$UDID" test .maestro/ --exclude-tags camera,hebrew,tour --test-output-dir e2e-ios/out 2>&1 | tee e2e-ios/core.log ; CODE=${PIPESTATUS[0]}
          # One retry, only when the driver never started: an app failure is not retried.
          if [ "$CODE" != 0 ] && grep -q "driver not ready in time" e2e-ios/core.log; then
            echo "Core flows: driver did not start, retrying once"
            CODE=0 ; maestro --device "$UDID" test .maestro/ --exclude-tags camera,hebrew,tour --test-output-dir e2e-ios/out || CODE=$?
          fi
          echo "--- Dark mode tour (08)"
          xcrun simctl ui "$UDID" appearance dark
          mkdir -p e2e-ios/dark
          maestro --device "$UDID" test -e SHOT=dark .maestro/08-tour.yaml --test-output-dir e2e-ios/out-dark || echo "Dark tour failed (non-gating)"
          find e2e-ios/out-dark screenshots -name '08-dark-*.png' 2>/dev/null | while read -r f; do cp "$f" "e2e-ios/dark/screenshot-$(basename "$f")"; done
          xcrun simctl ui "$UDID" appearance light
          echo "--- Large text tour (08, accessibility-extra-large)"
          xcrun simctl ui "$UDID" content_size accessibility-extra-large
          mkdir -p e2e-ios/bigfont
          maestro --device "$UDID" test -e SHOT=bigfont .maestro/08-tour.yaml --test-output-dir e2e-ios/out-bigfont || echo "Large text tour failed (non-gating)"
          find e2e-ios/out-bigfont screenshots -name '08-bigfont-*.png' 2>/dev/null | while read -r f; do cp "$f" "e2e-ios/bigfont/screenshot-$(basename "$f")"; done
          xcrun simctl ui "$UDID" content_size large
          echo "--- Hebrew / RTL (07)"
          xcrun simctl spawn "$UDID" defaults write NSGlobalDomain AppleLanguages -array he en
          xcrun simctl spawn "$UDID" defaults write NSGlobalDomain AppleLocale he_IL
          xcrun simctl shutdown "$UDID" && xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b >/dev/null
          # After a reboot the XCTest driver can take longer than Maestro's default to come up.
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          sleep 30
          mkdir -p e2e-ios/he
          xcrun simctl spawn "$UDID" defaults read NSGlobalDomain AppleLanguages || true
          # One retry: the driver start-up after the reboot still times out now and then.
          maestro --device "$UDID" test .maestro/07-hebrew-rtl.yaml --test-output-dir e2e-ios/out-he \
            || { echo "Hebrew flow: retrying once"; maestro --device "$UDID" test .maestro/07-hebrew-rtl.yaml --test-output-dir e2e-ios/out-he; } \
            || { echo "Hebrew flow failed (non-gating)"; xcrun simctl io "$UDID" screenshot e2e-ios/he/screenshot-he-failure.png; }
          find e2e-ios/out-he screenshots -name '07-*.png' 2>/dev/null | while read -r f; do cp "$f" "e2e-ios/he/screenshot-$(basename "$f")"; done
          sh ../.github/scripts/print-failure-shots.sh e2e-ios
          xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "Promptly"' --style compact 2>/dev/null | grep -i -E 'error|fault|exception|crash' | tail -n 80 || true
          exit $CODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptly-ios-e2e
          path: |
            promptly/e2e-ios
            promptly/screenshots
          retention-days: 7
