# Promptly CI: JS checks plus native compile checks (no signing, no store upload, no secrets).
# Native jobs prove that the app and the local module `modules/promptly-media` compile; they do not
# run anything on a device.
name: promptly-ci

on:
  push:
    branches: [claude/youthful-volta-vdsr0x]
    paths: ['promptly/**', '.github/workflows/promptly-ci.yml']
  workflow_dispatch:

concurrency:
  group: promptly-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: promptly

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            promptly/package-lock.json
            promptly/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Server
        working-directory: promptly/server
        run: npm ci && npm run typecheck && npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promptly/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Assemble debug APK
        working-directory: promptly/android
        run: |
          ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a > gradle.log 2>&1 \
            || { grep -n -E '^e: |^w: .*promptly|error:|What went wrong' -A3 gradle.log | head -200; tail -n 60 gradle.log; exit 1; }
          tail -n 20 gradle.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: promptly-android-debug-apk
          path: promptly/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Expo SDK 58 Swift packages need Swift tools 6.2 (Xcode 26+): pick the newest installed Xcode.
      - name: Select Xcode
        working-directory: .
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promptly/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install --clean
      - name: Pod install
        working-directory: promptly/ios
        run: pod install
      - name: Resolve Swift packages
        working-directory: promptly/ios
        run: xcodebuild -resolvePackageDependencies -workspace Promptly.xcworkspace -scheme Promptly 2>&1 | tail -n 60
      - name: Build for simulator (unsigned)
        working-directory: promptly/ios
        run: |
          xcodebuild -workspace Promptly.xcworkspace -scheme Promptly -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -n -E 'error:|fatal|Could not resolve' -A12 build.log | head -250;
                 grep -n 'Build ExpoModulesJSI' -A40 build.log | grep -v '^[0-9]*-    export' | head -120;
                 tail -n 40 build.log; exit 1; }
          tail -n 20 build.log
