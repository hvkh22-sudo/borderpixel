name = "promptly-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Deploying this creates billable infrastructure — founder approval required.
# Secrets: wrangler secret put ANTHROPIC_API_KEY / REVENUECAT_SECRET_KEY / PLAY_INTEGRITY_SA_JSON

[vars]
AI_ENABLED = "false"           # kill switch; set "true" only after approval
MODEL = "claude-opus-5-5"      # see docs/business/ai-unit-economics.md for the model decision
MAX_OUTPUT_TOKENS = "4000"
INPUT_USD_PER_MTOK = "4"       # must match MODEL's published price (cost accounting)
OUTPUT_USD_PER_MTOK = "20"
FREE_PER_MONTH = "5"
PRO_PER_MONTH = "150"
LIFETIME_GRANT = "300"
CREDIT_PACK_SIZE = "100"
IP_PER_DAY = "40"
DAILY_BUDGET_USD = "5"         # hard daily spend cap across all users

# Device integrity (docs/architecture/ai-proxy.md, "Device integrity").
# report = verify + log, never block (dev builds keep working). enforce blocks only
# unverified *free* requests; paying users are capped by UNVERIFIED_PAID_PER_DAY instead.
INTEGRITY_MODE = "report"
APPLE_TEAM_ID = ""             # 10-char Team ID (App ID prefix) — fill in before enforce
IOS_BUNDLE_ID = "app.promptly.placeholder"
APP_ATTEST_ALLOW_DEVELOPMENT = "false"
ANDROID_PACKAGE = "app.promptly.placeholder"
ANDROID_CERT_SHA256 = ""       # Play app-signing cert SHA-256, base64url, comma-separated
UNVERIFIED_PAID_PER_DAY = "30"

[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counters"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counters"]
