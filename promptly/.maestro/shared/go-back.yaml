# Navigate back one screen on either platform.
# Android: system back. iOS has no back key: tap the header back button, else edge-swipe.
appId: app.promptly.placeholder
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible:
              text: "Back"
          commands:
            - tapOn:
                text: "Back"
      # The back swipe starts at the leading edge: left in English, right in Hebrew (RTL).
      # Only one of the two swipes can go back, so trying both is safe.
      - runFlow:
          when:
            notVisible:
              text: "Back"
          commands:
            - swipe:
                start: 1%, 50%
                end: 80%, 50%
                duration: 400
            - swipe:
                start: 99%, 50%
                end: 20%, 50%
                duration: 400
